[package]
name = "conversation-recorder"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
resolver = "2"

[[bin]]
name = "conversation-recorder"
path = "src/main.rs"
harness = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-sys = "0.37"
esp-idf-hal = "0.46"
esp-idf-svc = "0.52.1"

[build-dependencies]
embuild = "0.33"
cc = "1"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/vadnet_bridge"]
remote_component = { name = "espressif/esp-sr", version = "2.6.2" }
